<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image source</title>
<!-- Rendered to ../assets/og-image.png (1200x630) with headless Chrome; see README. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Inter", system-ui, sans-serif; color: #fff;
    background:
      radial-gradient(70% 90% at 85% 15%, rgba(14, 124, 123, .55), transparent 60%),
      linear-gradient(150deg, #1b3a5c, #0d1d31);
    display: flex; flex-direction: column; justify-content: center; padding: 0 88px; box-sizing: border-box;
  }
  .photo { position: absolute; right: 80px; top: 50%; transform: translateY(-50%); width: 340px; height: 340px; border-radius: 28px; object-fit: cover; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .tag { display: inline-block; font-size: 22px; font-weight: 600; color: #7fd6d3; letter-spacing: .1em; text-transform: uppercase; }
  h1 { font-size: 92px; font-weight: 800; letter-spacing: -0.035em; margin: 18px 0 6px; line-height: 1; }
  .role { font-size: 40px; font-weight: 600; color: #c9dbee; }
  .stats { display: flex; gap: 36px; margin-top: 56px; }
  .stat b { display: block; font-size: 52px; font-weight: 800; letter-spacing: -0.03em; }
  .stat span { font-size: 19px; color: #b6c4d3; display: block; line-height: 1.35; }
  .stat:last-child { max-width: 180px; }
</style>
</head>
<body>
  <img class="photo" src="../assets/photo.jpg" alt="">
  <span class="tag">Open to Engineering Manager roles</span>
  <h1>Vu Thi Thuy</h1>
  <div class="role">Engineering Manager · Vietnam</div>
  <div class="stats">
    <div class="stat"><b>22+</b><span>years in delivery &amp; quality</span></div>
    <div class="stat"><b>18+</b><span>years leading teams</span></div>
    <div class="stat"><b>7+</b><span>years managing dev + QA teams</span></div>
  </div>
</body>
</html>
